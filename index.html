<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NR - NSK STORE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='75' x='5' font-size='65' font-family='Georgia,serif' font-weight='bold' fill='%230f172a'>N</text><text y='75' x='48' font-size='65' font-family='Georgia,serif' font-weight='bold' fill='%23000000'>R</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='72' x='8' font-size='62' font-family='Georgia,serif' font-weight='bold' fill='%230f172a'>N</text><text y='72' x='48' font-size='62' font-family='Georgia,serif' font-weight='bold' fill='%23000000'>R</text></svg>">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(180deg,#bae6fd 0%,#e0f2fe 50%,#f0f9ff 100%);color:#000;min-height:100vh}
body::before{content:"NR";position:fixed;top:52%;left:50%;transform:translate(-50%,-50%);font-size:210px;font-family:Georgia,serif;font-weight:bold;color:rgba(15,23,42,0.06);pointer-events:none;z-index:0;letter-spacing:8px}
header{background:rgba(255,255,255,0.88);backdrop-filter:blur(8px);color:#000;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #0f172a;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.logo-nr{font-family:Georgia,serif;font-size:26px;font-weight:bold;color:#0f172a;border:2px solid #0f172a;padding:2px 8px;border-radius:8px;letter-spacing:2px}
.logo-nr span{color:#000}
header h1{margin:0;font-size:18px;color:#000}
.btn{background:#fff;color:#0f172a;border:1.5px solid #0f172a;padding:7px 12px;border-radius:8px;font-weight:bold}
.btn-navy{background:#0f172a;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;width:100%;font-size:16px;margin-top:8px}
.container{padding:16px;max-width:600px;margin:auto;position:relative;z-index:1}
.card{background:rgba(255,255,255,0.95);border:1px solid #bae6fd;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 12px rgba(15,23,42,0.08);display:flex;gap:12px;align-items:center}
.card img{width:68px;height:68px;border-radius:10px;object-fit:cover;border:1px solid #7dd3fc}
.card-info{flex:1}
.price{color:#0f172a;font-weight:bold;margin-top:5px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,0.6);justify-content:center;align-items:center;padding:16px;z-index:99}
.modal-box{background:#fff;color:#000;padding:20px;border-radius:16px;width:100%;max-width:380px;max-height:85vh;overflow-y:auto;border:2px solid #0f172a}
input,select{width:100%;padding:10px;margin:6px 0 10px;border:1.5px solid #cbd5e1;border-radius:8px;box-sizing:border-box;font-size:15px}
.pay-box{background:#e0f2fe;padding:10px;border-radius:8px;margin-bottom:10px;border-right:4px solid #0f172a;font-size:14px}
.fab{position:fixed;bottom:20px;left:20px;background:#0f172a;color:#fff;border:none;padding:14px 22px;border-radius:30px;font-weight:bold;display:none;z-index:20}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo-nr">N<span>R</span></div><h1>NSK STORE</h1></div>
  <div id="adminControls"><button class="btn" onclick="openModal('loginModal')">دخول المالك</button></div>
</header>
<div class="container" id="productsList"><p style="text-align:center">جاري تحميل المنتجات...</p></div>
<button class="fab" id="addBtn" onclick="openModal('productModal')">+ إضافة منتج</button>

<div class="modal" id="loginModal"><div class="modal-box">
  <h3>دخول المالك - NR</h3>
  <input type="password" id="adminPass" placeholder="اكتب رمز الدخول">
  <button class="btn-navy" onclick="loginAdmin()">دخول</button>
  <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('loginModal')">إلغاء</button>
</div></div>

<div class="modal" id="productModal"><div class="modal-box">
  <h3>إضافة منتج جديد</h3>
  <input type="text" id="pName" placeholder="اسم المنتج">
  <input type="text" id="pPrice" placeholder="السعر (مثال: 1500 جنيه)">
  <input type="text" id="pDesc" placeholder="وصف المنتج">
  <label style="font-size:13px;font-weight:bold">اختر صورة المنتج من الهاتف:</label>
  <input type="file" id="pFile" accept="image/*" onchange="readImg(this)">
  <button class="btn-navy" onclick="saveProduct()">حفظ المنتج</button>
  <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('productModal')">إلغاء</button>
</div></div>
<div class="modal" id="settingsModal"><div class="modal-box">
  <h3>حسابات الدفع</h3>
  <input type="text" id="setBankak" placeholder="رقم حساب بنكك والاسم">
  <input type="text" id="setVodafone" placeholder="رقم فودافون كاش / إنستا باي">
  <button class="btn-navy" onclick="saveSettings()">حفظ</button>
  <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('settingsModal')">إلغاء</button>
</div></div>

<div class="modal" id="orderModal"><div class="modal-box">
  <h3 id="orderTitle">طلب منتج</h3>
  <input type="text" id="cName" placeholder="الاسم الكامل">
  <input type="tel" id="cPhone" placeholder="رقم الهاتف / واتساب">
  <select id="payMethod" onchange="updatePayInfo()">
    <option value="bankak">تطبيق بنكك (Bankak)</option>
    <option value="vodafone">فودافون كاش / إنستا باي</option>
    <option value="cod">الدفع عند الاستلام</option>
  </select>
  <div id="payDetails" class="pay-box"></div>
  <input type="text" id="txRef" placeholder="رقم العملية / المرجع">
  <button class="btn-navy" onclick="submitOrder()">تأكيد الطلب</button>
  <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('orderModal')">إلغاء</button>
</div></div>

<div class="modal" id="ordersViewModal"><div class="modal-box">
  <h3>طلبات العملاء</h3>
  <div id="ordersList"></div>
  <button class="btn" style="width:100%;margin-top:8px" onclick="closeModal('ordersViewModal')">إغلاق</button>
</div></div>

<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyC5WJrQz2oGe1whqFonZNCypPYF4aIwhGU",projectId:"nsk-store-c1a3b"});
const db=firebase.firestore();
let tok=localStorage.getItem('nsk_tok2')||'',cur=null,imgData='',pay={bankak:'لم يحدد بعد',vodafone:'لم يحدد بعد'};
const openModal=id=>document.getElementById(id).style.display='flex';
const closeModal=id=>document.getElementById(id).style.display='none';

function readImg(inp){
  if(!inp.files||!inp.files[0])return;
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'),s=Math.min(1,300/img.width);
      c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      imgData=c.toDataURL('image/jpeg',0.7);
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(inp.files[0]);
}

function updateUI(){
  const adm=!!tok;
  document.getElementById('addBtn').style.display=adm?'block':'none';
  document.getElementById('adminControls').innerHTML=adm?'<button class="btn" onclick="openOrders()">الطلبات</button> <button class="btn" onclick="openSettings()">الدفع</button> <button class="btn" onclick="logoutAdmin()">خروج</button>':'<button class="btn" onclick="openModal(\'loginModal\')">دخول المالك</button>';
  loadProducts();
}

function loginAdmin(){
  if(document.getElementById('adminPass').value.trim()==='69866986'){tok='admin';localStorage.setItem('nsk_tok2',tok);closeModal('loginModal');updateUI();}
  else alert('رمز الدخول غير صحيح');
}
function logoutAdmin(){tok='';localStorage.removeItem('nsk_tok2');updateUI();}

function saveProduct(){
  db.collection('products').add({
    name:document.getElementById('pName').value,
    price:document.getElementById('pPrice').value,
    desc:document.getElementById('pDesc').value,
    image:imgData
  }).then(()=>{
    closeModal('productModal');imgData='';
    ['pName','pPrice','pDesc','pFile'].forEach(i=>document.getElementById(i).value='');
    alert('تم إضافة المنتج بنجاح!');
  }).catch(e=>alert('خطأ: '+e.message));
}

function deleteProduct(id){if(confirm('حذف المنتج؟'))db.collection('products').doc(id).delete();}

function openSettings(){
  db.collection('settings').doc('payment').get().then(d=>{
    if(d.exists){document.getElementById('setBankak').value=d.data().bankak||'';document.getElementById('setVodafone').value=d.data().vodafone||'';}
    openModal('settingsModal');
  });
}

function saveSettings(){
  db.collection('settings').doc('payment').set({
    bankak:document.getElementById('setBankak').value,
    vodafone:document.getElementById('setVodafone').value
  }).then(()=>{closeModal('settingsModal');alert('تم حفظ بيانات الدفع بنجاح!');}).catch(e=>alert('خطأ: '+e.message));
}

function openOrder(name,price){
  cur={name,price};document.getElementById('orderTitle').innerText='طلب: '+name+' ('+price+')';
  db.collection('settings').doc('payment').get().then(d=>{
    if(d.exists)pay=d.data();
    updatePayInfo();openModal('orderModal');
  });
}

function updatePayInfo(){
  const m=document.getElementById('payMethod').value,b=document.getElementById('payDetails');
  if(m==='bankak'){b.style.display='block';b.innerHTML='<b>حساب بنكك:</b><br>'+(pay.bankak||'لم يحدد بعد');}
  else if(m==='vodafone'){b.style.display='block';b.innerHTML='<b>فودافون كاش / إنستا باي:</b><br>'+(pay.vodafone||'لم يحدد بعد');}
  else b.style.display='none';
}

function submitOrder(){
  db.collection('orders').add({
    product:cur.name,price:cur.price,
    customer:document.getElementById('cName').value,
    phone:document.getElementById('cPhone').value,
    method:document.getElementById('payMethod').value,
    ref:document.getElementById('txRef').value
  }).then(()=>{closeModal('orderModal');alert('تم إرسال طلبك بنجاح!');});
}

function openOrders(){
  openModal('ordersViewModal');
  db.collection('orders').onSnapshot(s=>{
    let h='';
    s.forEach(d=>{const o=d.data();h+=`<div style="border-bottom:1px solid #e2e8f0;padding:8px 0"><b>${o.product}</b> (${o.price})<br>العميل: ${o.customer} - ${o.phone}<br>الدفع: ${o.method} | المرجع: ${o.ref||'-'}</div>`;});
    document.getElementById('ordersList').innerHTML=h||'لا توجد طلبات حتى الآن';
  });
}

function loadProducts(){
  const adm=!!tok;
  db.collection('products').onSnapshot(s=>{
    let h='';
    s.forEach(d=>{
      const p=d.data();
      const img=p.image?`<img src="${p.image}">`:`<img src="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><text y='68' x='12' font-size='52' font-family='Georgia,serif' font-weight='bold' fill='%230f172a'>N</text><text y='68' x='48' font-size='52' font-family='Georgia,serif' font-weight='bold' fill='%23000000'>R</text></svg>">`;
      const btn=adm?`<button class="btn" style="background:#dc2626;color:#fff;border:none" onclick="deleteProduct('${d.id}')">حذف</button>`:`<button class="btn" style="background:#0f172a;color:#fff" onclick="openOrder('${p.name}','${p.price}')">اطلب</button>`;
      h+=`<div class="card">${img}<div class="card-info"><b>${p.name}</b><div style="font-size:13px;color:#334155">${p.desc||''}</div><div class="price">${p.price}</div></div>${btn}</div>`;
    });
    document.getElementById('productsList').innerHTML=h||'<p style="text-align:center">لا توجد منتجات مضافة حالياً</p>';
  });
}
updateUI();
</script>
</body>
</html>
