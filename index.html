<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSK STORE</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f4f4f5; color: #18181b; }
  header { background: #18181b; color: #eab308; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  .btn { background: #18181b; color: #eab308; border: 1px solid #eab308; padding: 8px 12px; border-radius: 8px; font-weight: bold; }
  .btn-gold { background: #eab308; color: #18181b; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 16px; margin-top: 8px; }
  .container { padding: 16px; max-width: 600px; margin: auto; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); display: flex; gap: 12px; align-items: center; }
  .card img { width: 65px; height: 65px; border-radius: 8px; object-fit: cover; background: #18181b; }
  .card-info { flex: 1; }
  .price { color: #16a34a; font-weight: bold; margin-top: 4px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; padding: 16px; z-index: 99; }
  .modal-box { background: #fff; padding: 20px; border-radius: 14px; width: 100%; max-width: 380px; }
  input, select { width: 100%; padding: 10px; margin: 6px 0 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
  .pay-box { background: #fef9c3; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eab308; font-size: 14px; }
  .fab { position: fixed; bottom: 20px; left: 20px; background: #18181b; color: #eab308; border: 2px solid #eab308; padding: 14px 20px; border-radius: 30px; font-weight: bold; display: none; }
</style>
</head>
<body>

<header>
  <h1>NSK STORE</h1>
  <div id="adminControls">
    <button class="btn" onclick="openModal('loginModal')">دخول المالك</button>
  </div>
</header>

<div class="container" id="productsList">
  <p style="text-align:center; color:#666;">لا توجد منتجات مضافة حالياً في متجر NSK</p>
</div>

<button class="fab" id="addBtn" onclick="openModal('productModal')">+ إضافة منتج</button>

<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>دخول المالك</h3>
    <input type="email" id="adminEmail" placeholder="البريد الإلكتروني">
    <input type="password" id="adminPass" placeholder="كلمة المرور">
    <button class="btn-gold" onclick="loginAdmin()">دخول</button>
    <button class="btn" style="width:100%; margin-top:8px;" onclick="closeModal('loginModal')">إلغاء</button>
  </div>
</div>

<div class="modal" id="productModal">
  <div class="modal-box">
    <h3>إضافة منتج جديد</h3>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="text" id="pPrice" placeholder="السعر (مثال: 1500 جنيه)">
    <input type="text" id="pDesc" placeholder="وصف المنتج">
    <input type="text" id="pImg" placeholder="رابط صورة المنتج (اختياري)">
    <button class="btn-gold" onclick="saveProduct()">حفظ المنتج</button>
    <button class="btn" style="width:100%; margin-top:8px;" onclick="closeModal('productModal')">إلغاء</button>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h3>حسابات الدفع</h3>
    <input type="text" id="setBankak" placeholder="رقم حساب بنكك والاسم">
    <input type="text" id="setVodafone" placeholder="رقم فودافون كاش / إنستا باي">
    <button class="btn-gold" onclick="saveSettings()">حفظ</button>
    <button class="btn" style="width:100%; margin-top:8px;" onclick="closeModal('settingsModal')">إلغاء</button>
  </div>
</div>

<div class="modal" id="orderModal">
  <div class="modal-box">
    <h3 id="orderTitle">طلب منتج</h3>
    <input type="text" id="cName" placeholder="الاسم الكامل">
    <input type="tel" id="cPhone" placeholder="رقم الهاتف / واتساب">
    <select id="payMethod" onchange="updatePayInfo()">
      <option value="bankak">تطبيق بنكك (Bankak)</option>
      <option value="vodafone">فودافون كاش / إنستا باي</option>
      <option value="cod">الدفع عند الاستلام</option>
    </select>
    <div id="payDetails" class="pay-box"></div>
    <input type="text" id="txRef" placeholder="رقم العملية / المرجع">
    <button class="btn-gold" onclick="submitOrder()">تأكيد الطلب</button>
    <button class="btn" style="width:100%; margin-top:8px;" onclick="closeModal('orderModal')">إلغاء</button>
  </div>
</div>

<div class="modal" id="ordersViewModal">
  <div class="modal-box">
    <h3>طلبات العملاء</h3>
    <div id="ordersList"></div>
    <button class="btn" style="width:100%; margin-top:8px;" onclick="closeModal('ordersViewModal')">إغلاق</button>
  </div>
</div>

<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyC5WJrQz2oGe1whqFonZNCypPYF4aIwhGU",
    authDomain: "://firebaseapp.com",
    projectId: "nsk-store-c1a3b",
    storageBucket: "nsk-store-c1a3b.firebasestorage.app",
    messagingSenderId: "1008840600192",
    appId: "1:1008840600192:web:22aaac3be8d16f75ec9465"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  let isAdmin = false;
  let currentProduct = null;
  let paymentInfo = { bankak: 'لم يحدد بعد', vodafone: 'لم يحدد بعد' };

  function openModal(id) { document.getElementById(id).style.display = 'flex'; }
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }

  auth.onAuthStateChanged(user => {
    isAdmin = !!user;
    document.getElementById('addBtn').style.display = isAdmin ? 'block' : 'none';
    document.getElementById('adminControls').innerHTML = isAdmin
      ? '<button class="btn" onclick="openOrders()">الطلبات</button> <button class="btn" onclick="openSettings()">الدفع</button> <button class="btn" onclick="auth.signOut()">خروج</button>'
      : '<button class="btn" onclick="openModal(\'loginModal\')">دخول المالك</button>';
    loadProducts();
  });

  function loginAdmin() {
    const email = document.getElementById('adminEmail').value.trim();
    const pass = document.getElementById('adminPass').value.trim();
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => closeModal('loginModal'))
      .catch(e => alert('خطأ: ' + e.message));
  }

  function saveProduct() {
    db.collection('products').add({
      name: document.getElementById('pName').value,
      price: document.getElementById('pPrice').value,
      desc: document.getElementById('pDesc').value,
      image: document.getElementById('pImg').value
    }).then(() => {
      closeModal('productModal');
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pImg').value = '';
    }).catch(e => alert('خطأ في الحفظ: ' + e.message));
  }

  function deleteProduct(id) {
    if (confirm('حذف المنتج؟')) db.collection('products').doc(id).delete();
  }

  function openSettings() {
    db.collection('settings').doc('payment').get().then(doc => {
      if (doc.exists) {
        document.getElementById('setBankak').value = doc.data().bankak || '';
        document.getElementById('setVodafone').value = doc.data().vodafone || '';
      }
      openModal('settingsModal');
    });
  }

  function saveSettings() {
    db.collection('settings').doc('payment').set({
      bankak: document.getElementById('setBankak').value,
      vodafone: document.getElementById('setVodafone').value
    }).then(() => { closeModal('settingsModal'); alert('تم الحفظ!'); });
  }

  function openOrder(name, price) {
    currentProduct = { name, price };
    document.getElementById('orderTitle').innerText = 'طلب: ' + name + ' (' + price + ')';
    db.collection('settings').doc('payment').get().then(doc => {
      if (doc.exists) paymentInfo = doc.data();
      updatePayInfo();
      openModal('orderModal');
    });
  }

  function updatePayInfo() {
    const m = document.getElementById('payMethod').value;
    const box = document.getElementById('payDetails');
    if (m === 'bankak') { box.style.display = 'block'; box.innerHTML = '<b>حساب بنكك:</b><br>' + paymentInfo.bankak; }
    else if (m === 'vodafone') { box.style.display = 'block'; box.innerHTML = '<b>فودافون كاش / إنستا باي:</b><br>' + paymentInfo.vodafone; }
    else { box.style.display = 'none'; }
  }

  function submitOrder() {
    db.collection('orders').add({
      product: currentProduct.name,
      price: currentProduct.price,
      customer: document.getElementById('cName').value,
      phone: document.getElementById('cPhone').value,
      method: document.getElementById('payMethod').value,
      ref: document.getElementById('txRef').value
    }).then(() => { closeModal('orderModal'); alert('تم إرسال طلبك بنجاح!'); });
  }

  function openOrders() {
    openModal('ordersViewModal');
    db.collection('orders').onSnapshot(snap => {
      let html = '';
      snap.forEach(d => {
        const o = d.data();
        html += `<div style="border-bottom:1px solid #eee;padding:8px 0;"><b>${o.product}</b> (${o.price})<br>العميل: ${o.customer} - ${o.phone}<br>الدفع: ${o.method} | المرجع: ${o.ref || '-'}</div>`;
      });
      document.getElementById('ordersList').innerHTML = html || 'لا توجد طلبات بعد';
    });
  }

  function loadProducts() {
    db.collection('products').onSnapshot(snap => {
      let html = '';
      snap.forEach(d => {
        const p = d.data();
        const img = p.image ? `<img src="${p.image}">` : `<img src="https://placeholder.com">`;
        const btn = isAdmin
