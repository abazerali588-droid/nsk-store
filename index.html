<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر NSK</title>
    <style>
        :root { --primary: #3f51b5; --owner: #b71c1c; --bg: #f4f6f9; }
        body { font-family: Tahoma, Arial, sans-serif; margin: 0; background: var(--bg); color: #333; }
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header.owner-mode { background: var(--owner); }
        .banner { background: #e8eaf6; color: #1a237e; text-align: center; padding: 10px; font-weight: bold; font-size: 14px; }
        .container { max-width: 600px; margin: 15px auto; padding: 0 15px 80px; }
        .card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); display: flex; gap: 12px; align-items: center; }
        .card img { width: 75px; height: 75px; object-fit: cover; border-radius: 8px; background: #eee; }
        .info { flex: 1; }
        .info h3 { margin: 0 0 4px; font-size: 16px; }
        .info p { margin: 0 0 6px; color: #666; font-size: 13px; }
        .price { color: #2e7d32; font-weight: bold; font-size: 15px; }
        button { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-owner { background: rgba(255,255,255,0.2); color: white; }
        .btn-del { background: #d32f2f; color: white; }
        .fab { position: fixed; bottom: 20px; left: 20px; background: var(--owner); color: white; padding: 14px 20px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 15px; display: none; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 200; padding: 15px; }
        .modal-box { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; }
        input, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .actions { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>

<header id="appHeader">
    <h2 id="storeTitle" style="margin:0;">متجر NSK</h2>
    <div>
        <button id="settingsBtn" class="btn-owner" style="display:none;" onclick="openModal('settingsModal')">الإعدادات</button>
        <button id="authBtn" class="btn-owner" onclick="toggleOwner()">⚙️ المالك</button>
    </div>
</header>

<div class="banner" id="welcomeBanner">أهلاً بكم في متجر NSK الرسمي</div>
<div class="container" id="productsList"></div>
<button class="fab" id="addFab" onclick="openModal('productModal')">+ إضافة منتج</button>

<!-- نافذة إضافة منتج -->
<div class="modal" id="productModal">
    <div class="modal-box">
        <h3 style="margin-top:0;">إضافة منتج جديد</h3>
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="number" id="pPrice" placeholder="السعر (ج.م)">
        <textarea id="pDesc" rows="2" placeholder="وصف المنتج"></textarea>
        <label style="font-size:13px; color:#555;">صورة المنتج (اختياري):</label>
        <input type="file" id="pImg" accept="image/*">
        <div class="actions">
            <button onclick="closeModal('productModal')">إلغاء</button>
            <button class="btn-primary" onclick="addProduct()">حفظ ونشر</button>
        </div>
    </div>
</div>

<!-- نافذة الطلب -->
<div class="modal" id="orderModal">
    <div class="modal-box">
        <h3 id="orderTitle" style="margin-top:0;">طلب منتج</h3>
        <input type="text" id="cName" placeholder="الاسم بالكامل">
        <input type="tel" id="cPhone" placeholder="رقم الهاتف">
        <input type="text" id="cAddress" placeholder="العنوان بالتفصيل">
        <div class="actions">
            <button onclick="closeModal('orderModal')">إلغاء</button>
            <button class="btn-primary" onclick="sendOrder()">تأكيد الطلب</button>
        </div>
    </div>
</div>

<!-- نافذة الإعدادات -->
<div class="modal" id="settingsModal">
    <div class="modal-box">
        <h3 style="margin-top:0;">إعدادات المتجر</h3>
        <input type="text" id="sName" placeholder="اسم المتجر">
        <input type="text" id="sBanner" placeholder="رسالة الترحيب">
        <input type="tel" id="sWhatsapp" placeholder="رقم واتساب لاستقبال الطلبات (مثال: 2010xxxxxxxx)">
        <div class="actions">
            <button onclick="closeModal('settingsModal')">إلغاء</button>
            <button class="btn-primary" onclick="saveSettings()">حفظ</button>
        </div>
    </div>
</div>

<script>
    let isOwner = false;
    const PIN = "1234";
    let currentProd = null;

    let data = JSON.parse(localStorage.getItem('nsk_v2')) || {
        name: "متجر NSK",
        banner: "أهلاً بكم في متجر NSK الرسمي - أفضل المنتجات بأفضل الأسعار",
        whatsapp: "",
        products: [
            { name: "منتج NSK الأساسي", price: "350", desc: "جودة ممتازة وضمان استبدال.", img: "" },
            { name: "منتج NSK برو", price: "690", desc: "الإصدار المطور بمواصفات عالية.", img: "" }
        ]
    };

    function save() {
        localStorage.setItem('nsk_v2', JSON.stringify(data));
        render();
    }

    function render() {
        document.getElementById('storeTitle').innerText = isOwner ? data.name + " (المالك)" : data.name;
        document.getElementById('welcomeBanner').innerText = data.banner;
        document.getElementById('appHeader').className = isOwner ? "owner-mode" : "";
        document.getElementById('authBtn').innerText = isOwner ? "خروج" : "⚙️ المالك";
        document.getElementById('addFab').style.display = isOwner ? "block" : "none";
        document.getElementById('settingsBtn').style.display = isOwner ? "inline-block" : "none";

        const list = document.getElementById('productsList');
        list.innerHTML = "";
        data.products.forEach((p, i) => {
            const imgTag = p.img ? `<img src="${p.img}">` : `<img src="https://placeholder.com">`;
            list.innerHTML += `
                <div class="card">
                    ${imgTag}
                    <div class="info">
                        <h3>${p.name}</h3>
                        <p>${p.desc}</p>
                        <div class="price">${p.price} ج.م</div>
                    </div>
                    <div>
                        ${isOwner 
                            ? `<button class="btn-del" onclick="delProd(${i})">حذف</button>`
                            : `<button class="btn-primary" onclick="openOrder(${i})">اطلب</button>`}
                    </div>
                </div>`;
        });
    }

    function toggleOwner() {
        if (isOwner) { isOwner = false; render(); return; }
        const code = prompt("أدخل رمز المالك (1234):");
        if (code === PIN) { isOwner = true; render(); }
        else if (code !== null) alert("رمز خاطئ!");
    }

    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const file = document.getElementById('pImg').files[0];

        if (!name || !price) return alert("اكتب اسم المنتج والسعر");

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                data.products.unshift({ name, price, desc, img: e.target.result });
                finishAdd();
            };
            reader.readAsDataURL(file);
        } else {
            data.products.unshift({ name, price, desc, img: "" });
            finishAdd();
        }
    }

    function finishAdd() {
        document.getElementById('pName').value = "";
        document.getElementById('pPrice').value = "";
        document.getElementById('pDesc').value = "";
        document.getElementById('pImg').value = "";
        closeModal('productModal');
        save();
    }

    function delProd(i) {
        if (confirm("حذف المنتج؟")) { data.products.splice(i, 1); save(); }
    }

    function openOrder(i) {
        currentProd = data.products[i];
        document.getElementById('orderTitle').innerText = "طلب: " + currentProd.name;
        openModal('orderModal');
    }

    function sendOrder() {
        const n = document.getElementById('cName').value;
        const p = document.getElementById('cPhone').value;
        const a = document.getElementById('cAddress').value;
        if (!n || !p) return alert("يرجى كتابة الاسم ورقم الهاتف");

        closeModal('orderModal');
        if (data.whatsapp) {
            const msg = `طلب جديد من متجر ${data.name}:%0Aالمنتج: ${currentProd.name}%0Aالسعر: ${currentProd.price} ج.م%0Aالعميل: ${n}%0Aالهاتف: ${p}%0Aالعنوان: ${a}`;
            window.open(`https://wa.me{data.whatsapp}?text=${msg}`, '_blank');
        } else {
            alert("تم استلام طلبك بنجاح! سنتواصل معك قريباً.");
        }
    }

    function saveSettings() {
        data.name = document.getElementById('sName').value || data.name;
        data.banner = document.getElementById('sBanner').value || data.banner;
        data.whatsapp = document.getElementById('sWhatsapp').value;
        closeModal('settingsModal');
        save();
    }

    function openModal(id) {
        if (id === 'settingsModal') {
            document.getElementById('sName').value = data.name;
            document.getElementById('sBanner').value = data.banner;
            document.getElementById('sWhatsapp').value = data.whatsapp;
        }
        document.getElementById(id).style.display = "flex";
    }

    function closeModal(id) { document.getElementById(id).style.display = "none"; }

    render();
</script>
</body>
</html>
