<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSK STORE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060b14;
            --card-dark: #0c1424;
            --input-dark: #070b12;
            --cyan: #0ea5e9;
            --cyan-glow: rgba(14, 165, 233, 0.25);
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; }

        /* الهيدر العلوي */
        header {
            background: #04080f;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            user-select: none;
            cursor: default;
            direction: ltr;
        }
        .brand-logo .white-part { color: #ffffff; }
        .brand-logo .blue-part { color: var(--cyan); }
        
        .header-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        .container { max-width: 1100px; margin: 25px auto; padding: 0 15px; }

        /* لوحة تحكم المالك (مطابقة للصورة) */
        .admin-panel {
            display: none;
            background: var(--card-dark);
            border: 1px solid #1e3a5f;
            box-shadow: 0 0 25px var(--cyan-glow);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-header h2 {
            color: var(--cyan);
            font-size: 18px;
            font-weight: 700;
        }
        .close-admin-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .section-box {
            background: rgba(7, 11, 18, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 18px;
        }
        .section-title {
            color: var(--cyan);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .form-input {
            width: 100%;
            background: var(--input-dark);
            border: 1px solid #1e293b;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: var(--cyan);
        }

        .btn-cyan {
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 5px;
        }
        .btn-cyan:hover { opacity: 0.9; }

        /* شبكة عرض المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .product-card:hover {
            transform: translateY(-4px);
            border-color: var(--cyan);
        }
        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #070b12;
        }
        .product-info { padding: 16px; }
        .product-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .product-price {
            font-size: 18px;
            font-weight: 900;
            color: var(--cyan);
            margin-bottom: 14px;
        }

        .order-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff;
            text-decoration: none;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            transition: 0.2s;
        }
        .order-btn:hover { box-shadow: 0 0 15px var(--cyan-glow); }

        .admin-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .delete-btn {
            flex: 1;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 7px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <div class="header-subtitle" id="headerNote">مرحباً بك في متجرنا</div>
    <div class="brand-logo" onclick="handleSecretClick()">
        <span class="white-part">STORE</span> <span class="blue-part">NSK</span>
    </div>
</header>

<div class="container">
    <!-- لوحة تحكم المالك (تفتح بعد 20 ضغطة على الشعار + الباسورد) -->
    <div id="adminPanel" class="admin-panel">
        <div class="admin-header">
            <h2>لوحة تحكم المالك (NSK Admin)</h2>
            <button class="close-admin-btn" onclick="logoutAdmin()">إغلاق اللوحة</button>
        </div>

        <!-- إعدادات المتجر والواتساب -->
        <div class="section-box">
            <span class="section-title">إعدادات المتجر والواتساب:</span>
            <div class="form-group">
                <input type="text" id="headerNoteInput" class="form-input" placeholder="النص العلوي بجانب الشعار (اكتب أي شيء أو اتركه فارغاً)">
            </div>
            <div class="form-group">
                <input type="text" id="whatsappNumberInput" class="form-input" placeholder="رقم الواتساب مع رمز الدولة (مثال: 249900000000)">
            </div>
            <div class="form-group">
                <input type="password" id="newPasswordInput" class="form-input" placeholder="تغيير كلمة مرور المالك (اتركه فارغاً لعدم التغيير)">
            </div>
            <button class="btn-cyan" onclick="saveSettings()">حفظ الإعدادات والواتساب</button>
        </div>

        <!-- إضافة منتج جديد -->
        <div class="section-box" style="margin-bottom: 0;">
            <span class="section-title">إضافة منتج جديد للمتجر:</span>
            <div class="form-group">
                <input type="text" id="pName" class="form-input" placeholder="اسم المنتج">
            </div>
            <div class="form-group">
                <input type="text" id="pPrice" class="form-input" placeholder="السعر (مثال: 50,000 ج.س)">
            </div>
            <div class="form-group">
                <textarea id="pDesc" class="form-input" rows="2" placeholder="وصف وتفاصيل المنتج..."></textarea>
            </div>
            <div class="form-group">
                <label>اختر صورة المنتج:</label>
                <input type="file" id="pImage" class="form-input" accept="image/*">
            </div>
            <button class="btn-cyan" onclick="addProduct()">+ نشر المنتج في المتجر</button>
        </div>
    </div>

    <!-- شبكة عرض المنتجات للزبائن -->
    <div id="productsList" class="products-grid"></div>
</div>

<script>
    // البيانات الأساسية
    let isAdmin = false;
    let adminPass = localStorage.getItem('nsk_pass') || '69866986';
    let whatsappNum = localStorage.getItem('nsk_whatsapp') || '249900000000';
    let headerNote = localStorage.getItem('nsk_note') || 'أفضل المنتجات بأفضل الأسعار';
    
    let products = JSON.parse(localStorage.getItem('nsk_products')) || [
        {
            id: 1,
            name: 'منتج تجريبي',
            price: '15,000 ج.س',
            desc: 'وصف المنتج يظهر هنا للزبون بشكل واضح وأنيق.',
            image: 'https://placeholder.com'
        }
    ];

    document.getElementById('headerNote').textContent = headerNote;

    // البوابة السرية (20 ضغطة على STORE NSK)
    let clickCount = 0;
    let clickTimer = null;

    function handleSecretClick() {
        if (isAdmin) {
            document.getElementById('adminPanel').style.display = 'block';
            return;
        }
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clickCount = 0; }, 3500);
        clickTimer = setTimeout(() => { clickCount = 0; }, 3500);

        if (clickCount >= 20) {
            clickCount = 0;
            let pass = prompt('أدخل كلمة المرور:');
            if (pass === adminPass) {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('whatsappNumberInput').value = whatsappNum;
                document.getElementById('headerNoteInput').value = headerNote;
                renderProducts();
            }
        }
    }

    function logoutAdmin() {
        isAdmin = false;
        document.getElementById('adminPanel').style.display = 'none';
        renderProducts();
    }

    // حفظ الإعدادات
    function saveSettings() {
        let newNum = document.getElementById('whatsappNumberInput').value.trim();
        let newNote = document.getElementById('headerNoteInput').value.trim();
        let newPass = document.getElementById('newPasswordInput').value.trim();

        if (newNum) {
            whatsappNum = newNum;
            localStorage.setItem('nsk_whatsapp', whatsappNum);
        }
        headerNote = newNote;
        localStorage.setItem('nsk_note', headerNote);
        document.getElementById('headerNote').textContent = headerNote;

        if (newPass) {
            adminPass = newPass;
            localStorage.setItem('nsk_pass', adminPass);
            document.getElementById('newPasswordInput').value = '';
        }

        alert('تم حفظ البيانات بنجاح!');
        renderProducts();
    }

    // إضافة منتج
    function addProduct() {
        let name = document.getElementById('pName').value.trim();
        let price = document.getElementById('pPrice').value.trim();
        let desc = document.getElementById('pDesc').value.trim();
        let fileInput = document.getElementById('pImage');

        if (!name || !price) {
            alert('يرجى كتابة اسم المنتج وسعره.');
            return;
        }

        if (fileInput.files && fileInput.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                saveProductData(name, price, desc, e.target.result);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            saveProductData(name, price, desc, 'https://placeholder.com');
        }
    }

    function saveProductData(name, price, desc, imgData) {
        products.unshift({ id: Date.now(), name, price, desc, image: imgData });
        localStorage.setItem('nsk_products', JSON.stringify(products));

        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pImage').value = '';

        renderProducts();
        alert('تم نشر المنتج!');
    }

    // حذف منتج
    function deleteProduct(id) {
        if (confirm('حذف هذا المنتج نهائياً؟')) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('nsk_products', JSON.stringify(products));
            renderProducts();
        }
    }

    // عرض المنتجات
    function renderProducts() {
        let list = document.getElementById('productsList');
        list.innerHTML = '';

        products.forEach(p => {
            let msg = encodeURIComponent(`مرحباً متجر NSK، أرغب في طلب:\n• المنتج: ${p.name}\n• السعر: ${p.price}`);
            let waLink = `https://wa.me{whatsappNum}?text=${msg}`;

            let adminHtml = isAdmin ? `
                <div class="admin-actions">
                    <button class="delete-btn" onclick="deleteProduct(${p.id})">🗑️ حذف المنتج</button>
                </div>` : '';

            list.innerHTML += `
                <div class="product-card">
                    <img src="${p.image}" class="product-img" alt="${p.name}">
                    <div class="product-info">
                        <div class="product-title">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-price">${p.price}</div>
                        <a href="${waLink}" target="_blank" class="order-btn">طلب</a>
                        ${adminHtml}
                    </div>
                </div>
            `;
        });
    }

    renderProducts();
</script>

</body>
</html>
