<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر NSK</title>
    <style>
        :root {
            --bg-black: #0f1115;
            --card-white: #ffffff;
            --primary-blue: #0066ff;
            --dark-blue: #004ecc;
            --text-dark: #1a1a1a;
        }
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { margin: 0; background-color: var(--bg-black); color: var(--card-white); }
        
        /* الهيدر */
        header {
            background-color: #000000;
            border-bottom: 2px solid var(--primary-blue);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 24px; font-weight: bold; color: var(--card-white); letter-spacing: 2px; }
        .logo span { color: var(--primary-blue); }
        
        .btn {
            border: none; padding: 10px 15px; border-radius: 6px;
            cursor: pointer; font-weight: bold; font-size: 14px;
        }
        .btn-blue { background-color: var(--primary-blue); color: white; }
        .btn-blue:hover { background-color: var(--dark-blue); }
        .btn-outline { background: transparent; border: 1px solid var(--primary-blue); color: white; }
        .btn-danger { background-color: #dc3545; color: white; margin-top: 8px; width: 100%; }

        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }

        /* لوحة المالك */
        #owner-panel {
            display: none;
            background: #1c1f26;
            border: 1px solid var(--primary-blue);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        #owner-panel h3 { margin-top: 0; color: var(--primary-blue); }
        input, textarea, select {
            width: 100%; padding: 10px; margin: 8px 0 15px;
            border-radius: 6px; border: 1px solid #444;
            background: #2a2e37; color: white;
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-white);
            color: var(--text-dark);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 18px; font-weight: bold; margin: 0 0 8px; }
        .card-desc { font-size: 14px; color: #555; margin: 0 0 12px; }
        .card-price { font-size: 18px; font-weight: bold; color: var(--primary-blue); margin-bottom: 12px; }

        /* نافذة الشراء (Modal) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: var(--card-white); color: var(--text-dark);
            padding: 20px; border-radius: 10px; width: 100%; max-width: 450px;
        }
        .modal-content input, .modal-content select { background: #f4f4f4; color: #000; border: 1px solid #ccc; }
        .payment-box {
            background: #eef5ff; border-right: 4px solid var(--primary-blue);
            padding: 10px; margin: 10px 0; font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo"><span>NSK</span> STORE</div>
    <button id="ownerBtn" class="btn btn-outline" onclick="toggleOwnerLogin()">دخول المالك</button>
</header>

<div class="container">
    <!-- لوحة تحكم المالك -->
    <div id="owner-panel">
        <h3>لوحة تحكم المالك - إضافة منتج جديد</h3>
        <input type="text" id="pName" placeholder="اسم المنتج">
        <input type="text" id="pPrice" placeholder="السعر (مثال: 15,000 جنيه)">
        <textarea id="pDesc" rows="3" placeholder="وصف المنتج بالتفصيل"></textarea>
        <label style="font-size: 13px; color: #ccc;">اختر صورة المنتج من جهازك:</label>
        <input type="file" id="pImage" accept="image/*">
        <button class="btn btn-blue" style="width: 100%;" onclick="addProduct()">نشر المنتج في المتجر</button>
    </div>

    <!-- عرض المنتجات -->
    <div id="products-list" class="products-grid"></div>
</div>

<!-- نافذة إتمام الشراء -->
<div id="buyModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color: var(--primary-blue);">إتمام الطلب: <span id="mProdName"></span></h3>
        <p style="font-weight:bold;">السعر: <span id="mProdPrice"></span></p>
        
        <label>اختر طريقة الدفع:</label>
        <select id="payMethod" onchange="updatePaymentInfo()">
            <option value="bankak">تطبيق بنكك (بنك الخرطوم)</option>
            <option value="vodafone">فودافون كاش (Vodafone Cash)</option>
        </select>

        <div id="paymentDetails" class="payment-box"></div>

        <input type="text" id="custName" placeholder="اسمك الكامل">
        <input type="text" id="custPhone" placeholder="رقم هاتفك (واتساب)">
        <input type="text" id="custAddress" placeholder="المدينة / عنوان التوصيل">
        <input type="text" id="transId" placeholder="رقم العملية / الإشعار بعد التحويل">

        <button class="btn btn-blue" style="width:100%;" onclick="sendOrderWhatsApp()">تأكيد وإرسال الإيصال واتساب</button>
        <button class="btn btn-danger" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<script>
    // ==========================================
    // إعداداتك الخاصة (عدّل هذه البيانات برقمك)
    // ==========================================
    const OWNER_PASS = "69866986";
    const WHATSAPP_NUMBER = "249900000000"; // ضع رقم الواتساب الخاص بك مع مفتاح الدولة بدون +
    const BANKAK_INFO = "رقم الحساب: 1234567 <br> الاسم: أبازر علي"; // ضع بيانات بنكك هنا
    const VODAFONE_INFO = "رقم المحفظة: 01000000000"; // ضع رقم فودافون كاش هنا
    // ==========================================

    let isOwner = false;
    let selectedProduct = null;

    // تحميل المنتجات المحفوظة أو عرض منتج تجريبي
    let products = JSON.parse(localStorage.getItem('nsk_products')) || [
        {
            id: 1,
            name: "منتج تجريبي NSK",
            price: "10,000 جنيه",
            desc: "هذا منتج تجريبي، يمكنك حذفه وإضافة منتجاتك من لوحة المالك.",
            image: "https://placeholder.com"
        }
    ];

    function renderProducts() {
        const list = document.getElementById('products-list');
        list.innerHTML = '';
        products.forEach((p, index) => {
            list.innerHTML += `
                <div class="card">
                    <img src="${p.image}" alt="${p.name}">
                    <div class="card-body">
                        <div>
                            <h4 class="card-title">${p.name}</h4>
                            <p class="card-desc">${p.desc}</p>
                        </div>
                        <div>
                            <div class="card-price">${p.price}</div>
                            <button class="btn btn-blue" style="width:100%;" onclick="openBuyModal(${index})">شراء الآن</button>
                            ${isOwner ? `<button class="btn btn-danger" onclick="deleteProduct(${index})">حذف المنتج</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function toggleOwnerLogin() {
        if (isOwner) {
            isOwner = false;
            document.getElementById('owner-panel').style.display = 'none';
            document.getElementById('ownerBtn').innerText = 'دخول المالك';
            renderProducts();
            return;
        }
        const pass = prompt("أدخل كلمة مرور المالك:");
        if (pass === OWNER_PASS) {
            isOwner = true;
            document.getElementById('owner-panel').style.display = 'block';
            document.getElementById('ownerBtn').innerText = 'خروج المالك';
            renderProducts();
        } else if (pass !== null) {
            alert("كلمة المرور غير صحيحة!");
        }
    }

    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const imgInput = document.getElementById('pImage');

        if (!name || !price || !imgInput.files[0]) {
            alert("يرجى إدخال اسم المنتج، السعر، واختيار صورة.");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            products.unshift({
                id: Date.now(),
                name: name,
                price: price,
                desc: desc,
                image: e.target.result
            });
            localStorage.setItem('nsk_products', JSON.stringify(products));
            renderProducts();
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDesc').value = '';
            imgInput.value = '';
            alert("تم إضافة المنتج بنجاح!");
        };
        reader.readAsDataURL(imgInput.files[0]);
    }

    function deleteProduct(index) {
        if (confirm("هل أنت متأكد من حذف هذا المنتج؟")) {
            products.splice(index, 1);
            localStorage.setItem('nsk_products', JSON.stringify(products));
            renderProducts();
