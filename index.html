<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSK | الفخامة في التسوق</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-black: #07090e;
            --surface-dark: #111622;
            --card-white: #ffffff;
            --royal-blue: #0066ff;
            --glow-blue: #00a3ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-black); color: var(--card-white); overflow-x: hidden; }
        header {
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 102, 255, 0.3);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--card-white);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand span {
            background: linear-gradient(135deg, var(--royal-blue), var(--glow-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge-vip {
            background: rgba(0, 102, 255, 0.15);
            border: 1px solid var(--royal-blue);
            color: var(--glow-blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .hero {
            background: radial-gradient(circle at top center, rgba(0, 102, 255, 0.25) 0%, var(--bg-black) 70%);
            text-align: center;
            padding: 45px 20px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hero h1 { font-size: 32px; font-weight: 900; margin-bottom: 10px; }
        .hero h1 span { color: var(--glow-blue); }
        .hero p { color: #94a3b8; font-size: 15px; max-width: 500px; margin: 0 auto 25px; }
        .search-box { max-width: 500px; margin: 0 auto; position: relative; }
        .search-box input {
            width: 100%; padding: 14px 20px; border-radius: 30px;
            border: 1px solid rgba(0, 102, 255, 0.4);
            background: var(--surface-dark); color: white; font-size: 15px; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--glow-blue); box-shadow: 0 0 15px rgba(0, 102, 255, 0.3); }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        #owner-panel {
            display: none;
            background: linear-gradient(145deg, #111622, #0a0d14);
            border: 1px solid var(--royal-blue);
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.2);
            padding: 25px; border-radius: 16px; margin-bottom: 35px;
        }
        .owner-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .owner-header h3 { color: var(--glow-blue); font-size: 20px; }
        .form-input {
            width: 100%; padding: 12px 15px; margin-bottom: 15px;
            border-radius: 10px; border: 1px solid #2a3447;
            background: #07090e; color: white; font-size: 14px;
        }
        .form-input:focus { border-color: var(--royal-blue); outline: none; }
        .btn { border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.3s; }
        .btn-luxury {
            background: linear-gradient(135deg, var(--royal-blue), #0044cc);
            color: white; box-shadow: 0 4px 15px rgba(0, 102, 255, 0.35); width: 100%;
        }
        .btn-luxury:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 102, 255, 0.5); }
        .btn-danger { background: rgba(220, 53, 69, 0.15); border: 1px solid #dc3545; color: #ff6b6b; width: 100%; margin-top: 8px; }
        .btn-copy { background: var(--royal-blue); color: white; padding: 5px 12px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; margin-top: 6px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 25px; }
        .card {
            background: var(--card-white); color: var(--text-dark); border-radius: 18px;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 35px rgba(0, 102, 255, 0.25); }
        .card-img-wrap { position: relative; width: 100%; height: 230px; background: #f1f5f9; overflow: hidden; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
        .price-tag {
            position: absolute; bottom: 12px; right: 12px; background: var(--bg-black); color: var(--card-white);
            padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 14px; border: 1px solid var(--royal-blue);
        }
        .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 19px; font-weight: 800; margin-bottom: 8px; color: var(--bg-black); }
        .card-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 18px; }
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(7, 9, 14, 0.9); backdrop-filter: blur(8px);
            z-index: 200; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: var(--card-white); color: var(--text-dark); padding: 25px; border-radius: 20px;
            width: 100%; max-width: 460px; box-shadow: 0 20px 50px rgba(0, 102, 255, 0.3); max-height: 90vh; overflow-y: auto;
        }
        .modal-content input, .modal-content select {
            width: 100%; padding: 12px; margin: 6px 0 14px; border-radius: 10px;
            border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-size: 14px;
        }
        .payment-card {
            background: #f0f7ff; border: 1px solid #bae6fd; border-right: 4px solid var(--royal-blue);
            padding: 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <div class="brand" id="secretLogo" onclick="handleSecretTap()"><span>NSK</span> STORE</div>
    <div class="badge-vip">تشكيلة حصرية</div>
</header>

<section class="hero">
    <h1>اختياراتك الفاخرة في <span>NSK</span></h1>
    <p>تسوق أحدث المنتجات المختارة بعناية مع خيارات دفع سريعة وآمنة عبر بنكك وفودافون كاش</p>
    <div class="search-box">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="ابحث عن منتج...">
    </div>
</section>

<div class="container">
    <div id="owner-panel">
        <div class="owner-header">
            <h3>لوحة تحكم المالك (NSK Admin)</h3>
            <button class="btn" style="background:#334155; color:white; padding:6px 14px; font-size:13px;" onclick="logoutOwner()">إغلاق اللوحة</button>
        </div>
        <input type="text" id="pName" class="form-input" placeholder="اسم المنتج الفاخر">
        <input type="text" id="pPrice" class="form-input" placeholder="السعر (مثال: 25,000 جنيه)">
        <textarea id="pDesc" class="form-input" rows="3" placeholder="وصف المنتج ومميزاته"></textarea>
        <label style="font-size: 13px; color: #94a3b8; display:block; margin-bottom:6px;">صورة المنتج عالية الجودة:</label>
        <input type="file" id="pImage" class="form-input" accept="image/*">
        <button class="btn btn-luxury" onclick="addProduct()">نشر المنتج الآن</button>
    </div>

    <div id="products-list" class="products-grid"></div>
</div>

<div id="buyModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--bg-black); font-size: 20px; margin-bottom: 5px;">إتمام الطلب الفوري</h3>
        <p style="color: var(--royal-blue); font-weight: 800; margin-bottom: 15px;" id="mProdTitle"></p>
        
        <label style="font-weight:700; font-size:13px;">وسيلة الدفع المفضلة:</label>
        <select id="payMethod" onchange="updatePaymentInfo()">
            <option value="bankak">تطبيق بنكك (بنك الخرطوم)</option>
            <option value="vodafone">فودافون كاش (Vodafone Cash)</option>
        </select>

        <div id="paymentDetails" class="payment-card"></div>

        <input type="text" id="custName" placeholder="الاسم الكامل للمستلم">
        <input type="text" id="custPhone" placeholder="رقم الواتساب للتواصل">
        <input type="text" id="custAddress" placeholder="المدينة / عنوان التوصيل">
        <input type="text" id="transId" placeholder="رقم العملية / الإشعار بعد التحويل">

        <button class="btn btn-luxury" onclick="sendOrderWhatsApp()">تأكيد الطلب وإرسال الإيصال واتساب</button>
        <button class="btn btn-danger" onclick="closeModal()">إلغاء</button>
    </div>
</div>
<script>
    const OWNER_PASS = "69866986";
    const WHATSAPP_NUMBER = "249900000000";
    const BANKAK_ACCOUNT = "1234567";
    const BANKAK_NAME = "أبازر علي";
    const VODAFONE_NUMBER = "01000000000";

    let isOwner = false;
    let selectedProduct = null;
    let tapCount = 0;
    let tapTimer = null;

    let products = JSON.parse(localStorage.getItem('nsk_products')) || [
        {
            id: 1,
            name: "ساعة NSK الملكية الكلاسيكية",
            price: "45,000 جنيه",
            desc: "تصميم عصري فاخر باللون الأسود والأزرق مقاوم للماء مع ضمان شامل.",
            image: "https://unsplash.com"
        }
    ];

    function handleSecretTap() {
        if (isOwner) return;
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 2000);

        if (tapCount >= 5) {
            tapCount = 0;
            const pass = prompt("أدخل رمز التحقق الخاص بالمالك:");
            if (pass === OWNER_PASS) {
                isOwner = true;
                document.getElementById('owner-panel').style.display = 'block';
                renderProducts();
            } else if (pass !== null) {
                alert("رمز غير صحيح.");
            }
        }
    }

    function logoutOwner() {
        isOwner = false;
        document.getElementById('owner-panel').style.display = 'none';
        renderProducts();
    }

    function renderProducts(listToRender = products) {
        const list = document.getElementById('products-list');
        list.innerHTML = '';
        listToRender.forEach((p) => {
            list.innerHTML += `
                <div class="card">
                    <div class="card-img-wrap">
                        <img src="${p.image}" alt="${p.name}">
                        <div class="price-tag">${p.price}</div>
                    </div>
                    <div class="card-body">
                        <div>
                            <h4 class="card-title">${p.name}</h4>
                            <p class="card-desc">${p.desc}</p>
                        </div>
                        <div>
                            <button class="btn btn-luxury" onclick="openBuyModal(${p.id})">اطلب الآن</button>
                            ${isOwner ? `<button class="btn btn-danger" onclick="deleteProduct(${p.id})">حذف المنتج</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function filterProducts() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
        renderProducts(filtered);
    }

    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const desc = document.getElementById('pDesc').value;
        const imgInput = document.getElementById('pImage');

        if (!name || !price || !imgInput.files) {
            alert("يرجى إدخال اسم المنتج، السعر، واختيار صورة.");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            products.unshift({
                id: Date.now(),
                name: name,
                price: price,
                desc: desc,
                image: e.target.result
            });
            localStorage.setItem('nsk_products', JSON.stringify(products));
            renderProducts();
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pDesc').value = '';
            imgInput.value = '';
            alert("تم نشر المنتج في متجر NSK بنجاح!");
        };
        reader.readAsDataURL(imgInput.files);
    }

    function deleteProduct(id) {
        if (confirm("حذف هذا المنتج نهائياً؟")) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('nsk_products', JSON.stringify(products));
            renderProducts();
        }
    }

    function openBuyModal(id) {
        selectedProduct = products.find(p => p.id === id);
        document.getElementById('mProdTitle').innerText = `${selectedProduct.name} — (${selectedProduct.price})`;
        updatePaymentInfo();
        document.getElementById('buyModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('buyModal').style.display = 'none';
    }

    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert("تم نسخ الرقم: " + text);
    }

    function updatePaymentInfo() {
        const method = document.getElementById('payMethod').value;
        const box = document.getElementById('paymentDetails');
        if (method === 'bankak') {
            box.innerHTML = `
                <strong>التحويل عبر تطبيق بنكك:</strong><br>
                رقم الحساب: <span style="font-size:16px; font-weight:bold; color:#0066ff;">${BANKAK_ACCOUNT}</span><br>
                اسم المستفيد: ${BANKAK_NAME}<br>
                <button type="button" class="btn-copy" onclick="copyText('${BANKAK_ACCOUNT}')">نسخ رقم الحساب</button>
            `;
        } else {
            box.innerHTML = `
                <strong>التحويل عبر فودافون كاش:</strong><br>
                رقم المحفظة: <span style="font-size:16px; font-weight:bold; color:#0066ff;">${VODAFONE_NUMBER}</span><br>
                <button type="button" class="btn-copy" onclick="copyText('${VODAFONE_NUMBER}')">نسخ رقم المحفظة</button>
            `;
        }
    }

    function sendOrderWhatsApp() {
        const cName = document.getElementById('custName').value;
        const cPhone = document.getElementById('custPhone').value;
        const cAddress = document.getElementById('custAddress').value;
        const transId = document.getElementById('transId').value;
        const method = document.getElementById('payMethod').options[document.getElementById('payMethod').selectedIndex].text;

        if (!cName || !cPhone || !transId) {
            alert("يرجى إكمال بيانات الاسم ورقم الهاتف ورقم العملية.");
            return;
        }

        const msg = `طلب جديد من متجر NSK الفاخر:%0A` +
                    `- المنتج: ${selectedProduct.name}%0A` +
                    `- السعر: ${selectedProduct.price}%0A` +
                    `- وسيلة الدفع: ${method}%0A` +
                    `- رقم الإشعار: ${transId}%0A` +
                    `- العميل: ${cName}%0A` +
                    `- الهاتف: ${cPhone}%0A` +
                    `- العنوان: ${cAddress}%0A` +
                    `(مرفق صورة إيصال التحويل)`;

        window.open(`https://wa.me{WHATSAPP_NUMBER}?text=${msg}`, '_blank');
        closeModal();
    }

    renderProducts();
</script>
</body>
</html>
