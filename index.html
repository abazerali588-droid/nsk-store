<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NSK STORE</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060b14;
            --card-dark: #0c1424;
            --input-dark: #070b12;
            --cyan: #0ea5e9;
            --cyan-glow: rgba(14, 165, 233, 0.25);
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 60px; }

        header {
            background: #04080f;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            cursor: default;
            outline: none;
            direction: ltr;
            padding: 4px 8px;
        }
        .brand-logo .white-part { color: #ffffff; }
        .brand-logo .blue-part { color: var(--cyan); }

        .cart-btn {
            background: #0c1424;
            border: 1px solid #1e3a5f;
            color: var(--cyan);
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-badge {
            background: #ef4444;
            color: white;
            font-size: 12px;
            padding: 1px 7px;
            border-radius: 50px;
        }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }

        .admin-panel {
            display: none;
            background: var(--card-dark);
            border: 1px solid #1e3a5f;
            box-shadow: 0 0 25px var(--cyan-glow);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 25px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-header h2 { color: var(--cyan); font-size: 18px; }
        .close-btn {
            background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
            padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .section-box {
            background: rgba(7, 11, 18, 0.6); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 15px; margin-bottom: 15px;
        }
        .section-title { color: var(--cyan); font-size: 14px; font-weight: 700; margin-bottom: 10px; display: block; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        .form-input {
            width: 100%; background: var(--input-dark); border: 1px solid #1e293b;
            color: #fff; padding: 11px; border-radius: 10px; font-size: 14px; outline: none;
        }
        .form-input:focus { border-color: var(--cyan); }
        .btn-cyan {
            width: 100%; background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #fff; border: none; padding: 11px; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 5px;
        }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px;
        }
        .product-card {
            background: var(--card-dark); border: 1px solid var(--border-color);
            border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
        }
        .img-slider { position: relative; width: 100%; height: 230px; background: #070b12; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.65); color: white; border: none;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 16px;
        }
        .prev-btn { right: 8px; }
        .next-btn { left: 8px; }
        .img-counter {
            position: absolute; bottom: 8px; left: 10px;
            background: rgba(0,0,0,0.7); color: #fff; font-size: 11px;
            padding: 2px 8px; border-radius: 10px;
        }

        .product-info { padding: 15px; }
        .product-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 5px; }
        .product-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; }

        .price-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #070b12; padding: 8px 12px; border-radius: 10px;
            border: 1px solid #1e293b; margin-bottom: 12px;
        }
        .base-price { font-size: 13px; color: var(--text-muted); }
        .total-price { font-size: 17px; font-weight: 900; color: var(--cyan); }

        .qty-controls {
            display: flex; align-items: center; justify-content: space-between;
            background: #070b12; border: 1px solid #1e293b; border-radius: 10px;
            padding: 4px; margin-bottom: 10px;
        }
        .qty-btn {
            background: #1e293b; color: var(--cyan); border: none;
            width: 36px; height: 34px; border-radius: 8px; font-size: 18px; font-weight: 900; cursor: pointer;
        }
        .qty-val { font-size: 16px; font-weight: 700; color: #fff; }

        .card-actions { display: flex; gap: 8px; }
        .add-cart-btn {
            flex: 1; background: #1e293b; color: var(--cyan); border: 1px solid #1e3a5f;
            padding: 10px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        .direct-order-btn {
            flex: 1; background: linear-gradient(135deg, #0284c7, #0ea5e9); color: #fff;
            border: none; padding: 10px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
        }
        .delete-btn {
            width: 100%; background: rgba(239,68,68,0.15); color: #f87171;
            border: 1px solid rgba(239,68,68,0.3); padding: 7px; border-radius: 8px;
            margin-top: 8px; cursor: pointer; font-size: 12px;
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: var(--card-dark); border: 1px solid #1e3a5f; border-radius: 18px;
            width: 100%; max-width: 450px; padding: 20px; max-height: 85vh; overflow-y: auto;
        }
        .cart-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <button class="cart-btn" onclick="openCart()">
        🛒 السلة <span class="cart-badge" id="cartBadge">0</span>
    </button>
    <div class="brand-logo" id="secretLogo">
        <span class="white-part">STORE</span> <span class="blue-part">NSK</span>
    </div>
</header>

<div class="container">
    <div id="adminPanel" class="admin-panel">
        <div class="admin-header">
            <h2>لوحة تحكم المالك (NSK Admin)</h2>
            <button class="close-btn" onclick="logoutAdmin()">إغلاق</button>
        </div>

        <div class="section-box">
            <span class="section-title">إعدادات الواتساب والعملة:</span>
            <div class="form-group">
                <input type="text" id="whatsappNumberInput" class="form-input" placeholder="رقم الواتساب مع رمز الدولة (مثال: 249999580005)">
            </div>
            <div class="form-group">
                <input type="text" id="currencyInput" class="form-input" placeholder="العملة (مثال: ج.س)">
            </div>
            <div class="form-group">
                <input type="password" id="newPasswordInput" class="form-input" placeholder="كلمة مرور جديدة (اتركه فارغاً لعدم التغيير)">
            </div>
            <button class="btn-cyan" onclick="saveSettings()">حفظ الإعدادات</button>
        </div>

        <div class="section-box" style="margin-bottom:0;">
            <span class="section-title">إضافة منتج جديد (يمكنك اختيار عدة صور):</span>
            <div class="form-group">
                <input type="text" id="pName" class="form-input" placeholder="اسم المنتج">
            </div>
            <div class="form-group">
                <input type="number" id="pPrice" class="form-input" placeholder="السعر الأساسي أرقام فقط (مثال: 15000)">
            </div>
            <div class="form-group">
                <textarea id="pDesc" class="form-input" rows="2" placeholder="وصف المنتج..."></textarea>
            </div>
            <div class="form-group">
                <label>اختر صورة أو عدة صور للمنتج:</label>
