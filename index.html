<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSK STORE | الفخامة في التسوق</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-black: #07090e;
            --surface-dark: #111622;
            --card-white: #ffffff;
            --royal-blue: #0066ff;
            --glow-blue: #00a3ff;
            --text-dark: #0f172a;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-black); color: var(--card-white); overflow-x: hidden; }
        header {
            background: rgba(7, 9, 14, 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 102, 255, 0.4); padding: 14px 20px;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .brand { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: var(--card-white); cursor: pointer; user-select: none; }
        .brand span { color: var(--glow-blue); }
        .cart-btn {
            background: rgba(0, 102, 255, 0.15); border: 1px solid var(--royal-blue);
            color: white; padding: 6px 14px; border-radius: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;
        }
        .cart-count { background: #ef4444; color: white; border-radius: 50%; padding: 1px 7px; font-size: 12px; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .panel-box {
            background: linear-gradient(145deg, #111622, #0a0d14); border: 1px solid var(--royal-blue);
            padding: 20px; border-radius: 16px; margin-bottom: 25px;
        }
        .form-input {
            width: 100%; padding: 11px 14px; margin-bottom: 12px; border-radius: 10px;
            border: 1px solid #2a3447; background: #07090e; color: white; font-size: 14px;
        }
        .btn { border: none; padding: 11px 18px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.2s; }
        .btn-blue { background: linear-gradient(135deg, var(--royal-blue), #0044cc); color: white; width: 100%; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card {
            background: var(--card-white); color: var(--text-dark); border-radius: 16px;
            overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column;
        }
        .card img { width: 100%; height: 210px; object-fit: cover; background: #e2e8f0; }
        .card-body { padding: 16px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
        .card-price { font-size: 17px; font-weight: 900; color: var(--royal-blue); margin: 10px 0; }
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            z-index: 200; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: var(--card-white); color: var(--text-dark); padding: 22px; border-radius: 18px;
            width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto;
        }
        .bank-info {
            background: #eff6ff; border-right: 4px solid var(--royal-blue); padding: 12px;
            border-radius: 8px; margin: 12px 0; font-size: 14px; line-height: 1.7;
        }
        .status-box { padding: 15px; border-radius: 12px; text-align: center; margin-top: 15px; font-weight: 700; }
    </style>
</head>
<body>

<header>
    <button class="cart-btn" onclick="openCart()">🛒 السلة <span class="cart-count" id="cartCount">0</span></button>
    <div id="headerNote" style="font-size:12px; color:#94a3b8;"></div>
    <div class="brand" onclick="handleSecretTap()">STORE <span>NSK</span></div>
</header>

<div class="container">
    <!-- لوحة تحكم المالك -->
    <div id="adminPanel" class="panel-box" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="color:var(--glow-blue);">لوحة تحكم المالك (NSK Admin)</h3>
            <button class="btn" style="background:#334155; color:white; padding:6px 12px;" onclick="closeAdmin()">إغلاق اللوحة</button>
        </div>

        <p style="font-size:13px; color:#94a3b8; margin-bottom:8px;">إعدادات المتجر وبنك الخرطوم والواتساب:</p>
        <input type="text" id="setNote" class="form-input" placeholder="النص العلوي بجانب الشعار">
        <input type="text" id="setBankAcc" class="form-input" placeholder="رقم حساب بنكك">
        <input type="text" id="setBankName" class="form-input" placeholder="اسم صاحب الحساب في بنكك">
        <input type="text" id="setWhats" class="form-input" placeholder="رقم الواتساب (مثال: 249912345678)">
        <button class="btn btn-blue" style="margin-bottom:25px;" onclick="saveSettings()">حفظ بيانات الدفع والواتساب</button>

        <hr style="border-color:#1e293b; margin-bottom:20px;">
        <h4 style="color:var(--glow-blue); margin-bottom:10px;">إضافة منتج جديد للمتجر:</h4>
        <input type="text" id="pName" class="form-input" placeholder="اسم المنتج">
        <input type="number" id="pPrice" class="form-input" placeholder="السعر بالأرقام فقط (مثال: 15000)">
        <textarea id="pDesc" class="form-input" rows="2" placeholder="وصف المنتج"></textarea>
        <label style="font-size:13px; color:#cbd5e1; display:block; margin-bottom:5px;">صورة المنتج:</label>
        <input type="file" id="pImage" class="form-input" accept="image/*">
        <button class="btn btn-blue" id="publishBtn" onclick="addProduct()">نشر المنتج في المتجر</button>

        <hr style="border-color:#1e293b; margin:25px 0;">
        <h4 style="color:#fbbf24; margin-bottom:10px;">طلبات الدفع قيد المراجعة:</h4>
        <div id="adminOrdersList"></div>
    </div>

    <!-- شبكة المنتجات -->
    <div id="productsGrid" class="products-grid"></div>
</div>

<!-- نافذة السلة والدفع -->
<div id="cartModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:10px;">سلة المشتريات والدفع</h3>
        <div id="cartItems" style="margin-bottom:12px; font-size:14px;"></div>
        <div style="font-weight:900; font-size:16px; color:var(--royal-blue); margin-bottom:10px;">
            المبلغ الإجمالي المطلوب: <span id="cartTotal">0</span> ج.س
        </div>

        <div id="checkoutStep1">
            <div class="bank-info">
                <strong>يرجى الدفع عبر تطبيق بنكك (بنك الخرطوم):</strong><br>
                اسم الحساب: <span id="dispBankName" style="font-weight:bold;"></span><br>
                رقم الحساب: <span id="dispBankAcc" style="font-weight:bold; color:#0066ff; font-size:16px;"></span>
            </div>
            <input type="text" id="custName" placeholder="اسمك الكامل" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px;">
            <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:5px;">أرفق صورة إشعار التحويل:</label>
            <input type="file" id="receiptImg" accept="image/*" style="width:100%; margin-bottom:12px;">
            <button class="btn btn-blue" onclick="submitReceipt()">إرسال الإشعار للمراجعة</button>
        </div>

        <div id="checkoutStatus" style="display:none;"></div>

        <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="closeCart()">إغلاق</button>
    </div>
</div>
<script>
    const OWNER_PASS = "69866986";
    let isAdmin = false;
    let tapCount = 0;
    let tapTimer = null;

    let settings = JSON.parse(localStorage.getItem('nsk_settings')) || {
        note: "أهلاً بكم",
        bankAcc: "0000000",
        bankName: "صاحب متجر NSK",
        whats: "249900000000"
    };

    let products = JSON.parse(localStorage.getItem('nsk_products')) || [];
    let cart = [];
    let currentOrder = JSON.parse(localStorage.getItem('nsk_current_order')) || null;

    function init() {
        document.getElementById('headerNote').innerText = settings.note;
        document.getElementById('setNote').value = settings.note;
        document.getElementById('setBankAcc').value = settings.bankAcc;
        document.getElementById('setBankName').value = settings.bankName;
        document.getElementById('setWhats').value = settings.whats;
        renderProducts();
        renderAdminOrders();
    }

    function handleSecretTap() {
        if (isAdmin) return;
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
        if (tapCount >= 5) {
            tapCount = 0;
            const pass = prompt("أدخل كلمة مرور المالك:");
            if (pass === OWNER_PASS) {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                renderProducts();
                renderAdminOrders();
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }
    }

    function closeAdmin() {
        isAdmin = false;
        document.getElementById('adminPanel').style.display = 'none';
        renderProducts();
    }

    function saveSettings() {
        settings.note = document.getElementById('setNote').value;
        settings.bankAcc = document.getElementById('setBankAcc').value;
        settings.bankName = document.getElementById('setBankName').value;
        settings.whats = document.getElementById('setWhats').value;
        localStorage.setItem('nsk_settings', JSON.stringify(settings));
        document.getElementById('headerNote').innerText = settings.note;
        alert("تم حفظ بيانات الدفع والواتساب بنجاح!");
    }

    // ضغط الصورة تلقائياً لضمان نشر المنتج فوراً دون توقف
    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxW = 500;
                const scale = maxW / img.width;
                canvas.width = maxW;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function addProduct() {
        const name = document.getElementById('pName').value.trim();
        const price = document.getElementById('pPrice').value.trim();
        const desc = document.getElementById('pDesc').value.trim();
        const fileInput = document.getElementById('pImage');

        if (!name || !price || !fileInput.files) {
            alert("يرجى كتابة اسم المنتج، السعر، واختيار صورة.");
            return;
        }

        const btn = document.getElementById('publishBtn');
        btn.innerText = "جاري النشر...";
        btn.disabled = true;

        compressImage(fileInput.files, function(compressedBase64) {
            try {
                products.unshift({ id: Date.now(), name, price: Number(price), desc, image: compressedBase64 });
                localStorage.setItem('nsk_products', JSON.stringify(products));
                renderProducts();
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pDesc').value = '';
                fileInput.value = '';
                alert("تم نشر المنتج بنجاح!");
            } catch (e) {
                alert("ذاكرة المتصفح ممتلئة، احذف بعض المنتجات القديمة أولاً.");
            }
            btn.innerText = "نشر المنتج في المتجر";
            btn.disabled = false;
        });
    }

    function deleteProduct(id) {
        if (confirm("حذف هذا المنتج؟")) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('nsk_products', JSON.stringify(products));
            renderProducts();
        }
    }

    function renderProducts() {
        const grid = document.getElementById('productsGrid');
        if (products.length === 0) {
            grid.innerHTML = '<p style="text-align:center; color:#94a3b8; grid-column:1/-1;">لا توجد منتجات معروضة حالياً.</p>';
            return;
        }
        grid.innerHTML = products.map(p => `
            <div class="card">
                <img src="${p.image}" alt="${p.name}">
                <div class="card-body">
                    <div>
                        <h4 class="card-title">${p.name}</h4>
                        <p style="font-size:13px; color:#64748b;">${p.desc}</p>
                    </div>
                    <div>
                        <div class="card-price">${p.price.toLocaleString()} ج.س</div>
                        <button class="btn btn-blue" onclick="addToCart(${p.id})">إضافة للسلة / شراء</button>
                        ${isAdmin ? `<button class="btn btn-red" style="width:100%; margin-top:6px;" onclick="deleteProduct(${p.id})">حذف المنتج</button>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function addToCart(id) {
        const prod = products.find(p => p.id === id);
        cart.push(prod);
        document.getElementById('cartCount').innerText = cart.length;
        openCart();
    }

    function openCart() {
        document.getElementById('dispBankName').innerText = settings.bankName;
        document.getElementById('dispBankAcc').innerText = settings.bankAcc;
        
        const itemsDiv = document.getElementById('cartItems');
        let total = 0;
        itemsDiv.innerHTML = cart.map((item, idx) => {
            total += item.price;
            return `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:5px 0;">
                <span>${item.name}</span><span>${item.price.toLocaleString()} ج.س</span>
            </div>`;
        }).join('');
        document.getElementById('cartTotal').innerText = total.toLocaleString();

        checkOrderView();
        document.getElementById('cartModal').style.display = 'flex';
    }

    function closeCart() {
        document.getElementById('cartModal').style.display = 'none';
    }

    function submitReceipt() {
        const cName = document.getElementById('custName').value.trim();
        const rFile = document.getElementById('receiptImg').files;
        const total = document.getElementById('cartTotal').innerText;

        if (cart.length === 0) return alert("السلة فارغة!");
        if (!cName || !rFile) return alert("يرجى كتابة اسمك وإرفاق صورة إشعار الدفع.");

        compressImage(rFile, function(receiptBase64) {
            currentOrder = {
                id: Date.now(),
                customer: cName,
                total: total,
                items: cart.map(i => i.name).join(' + '),
                receipt: receiptBase64,
                status: 'pending'
            };
            localStorage.setItem('nsk_current_order', JSON.stringify(currentOrder));
            checkOrderView();
            renderAdminOrders();

            const msg = `*Snk - إشعار دفع جديد*%0Aهنا من دفع المال، راجع الطلب:%0A- العميل: ${cName}%0A- الطلب: ${currentOrder.items}%0A- المبلغ: ${total} ج.س%0A(تم رفع صورة الإشعار داخل التطبيق)`;
            window.open(`https://wa.me{settings.whats}?text=${msg}`, '_blank');
        });
    }

    function checkOrderView() {
        const step1 = document.getElementById('checkoutStep1');
        const statusDiv = document.getElementById('checkoutStatus');
        currentOrder = JSON.parse(localStorage.getItem('nsk_current_order'));

        if (!currentOrder) {
            step1.style.display = 'block';
            statusDiv.style.display = 'none';
            return;
        }

        step1.style.display = 'none';
        statusDiv.style.display = 'block';

        if (currentOrder.status === 'pending') {
            statusDiv.innerHTML = `<div class="status-box" style="background:#fef3c7; color:#92400e;">⏳ يتم مراجعة طلبك الآن... يرجى الانتظار</div>`;
        } else if (currentOrder.status === 'approved') {
            statusDiv.innerHTML = `
                <div class="status-box" style="background:#d1fae5; color:#065f46;">
                    ✅ إشعار صحيح! يتم إتمام طلبك الآن.<br>يرجى تحديد موقع التسليم على الخريطة لإرساله للمتجر:
                    <button class="btn btn-green" style="width:100%; margin-top:10px;" onclick="sendLocationWhatsApp()">📍 تحديد موقعي وإرساله واتساب</button>
                </div>`;
        } else if (currentOrder.status === 'rejected') {
            statusDiv.innerHTML = `
                <div class="status-box" style="background:#fee2e2; color:#991b1b;">
                    ❌ إشعار غير صحيح، لم يتم إتمام طلبك.
                    <button class="btn btn-blue" style="margin-top:10px;" onclick="resetOrder()">إعادة المحاولة</button>
                </div>`;
        }
    }

    function resetOrder() {
        localStorage.removeItem('nsk_current_order');
        checkOrderView();
    }

    function renderAdminOrders() {
        const div = document.getElementById('adminOrdersList');
        const order = JSON.parse(localStorage.getItem('nsk_current_order'));
