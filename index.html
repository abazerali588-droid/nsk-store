<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSK STORE</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #07090e; color: #ffffff; }
        header {
            background: #0d111a; border-bottom: 2px solid #0066ff; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .brand { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #ffffff; cursor: pointer; user-select: none; }
        .brand span { color: #00a3ff; }
        .cart-btn {
            background: #0066ff; border: none; color: white; padding: 8px 15px;
            border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .container { max-width: 850px; margin: 20px auto; padding: 0 15px; }
        .panel-box {
            background: #111622; border: 1px solid #0066ff; padding: 20px;
            border-radius: 14px; margin-bottom: 25px;
        }
        .form-input {
            width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px;
            border: 1px solid #2a3447; background: #07090e; color: white; font-size: 14px;
        }
        .btn { border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-blue { background: #0066ff; color: white; width: 100%; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
        .card {
            background: #ffffff; color: #0f172a; border-radius: 14px;
            overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.6); display: flex; flex-direction: column;
        }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #e2e8f0; }
        .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .card-price { font-size: 17px; font-weight: bold; color: #0066ff; margin: 10px 0; }
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            z-index: 200; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content {
            background: #ffffff; color: #0f172a; padding: 20px; border-radius: 16px;
            width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto;
        }
        .bank-info {
            background: #eff6ff; border-right: 4px solid #0066ff; padding: 12px;
            border-radius: 8px; margin: 12px 0; font-size: 14px; line-height: 1.8;
        }
        .status-box { padding: 15px; border-radius: 10px; text-align: center; margin-top: 12px; font-weight: bold; line-height: 1.6; }
    </style>
</head>
<body>

<header>
    <button class="cart-btn" onclick="openCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
    <div id="headerNote" style="font-size:12px; color:#94a3b8;"></div>
    <div class="brand" onclick="handleSecretTap()"><span>NSK</span> STORE</div>
</header>

<div class="container">
    <div id="adminPanel" class="panel-box" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="color:#00a3ff;">لوحة تحكم المالك (NSK)</h3>
            <button class="btn" style="background:#334155; color:white; padding:6px 12px;" onclick="closeAdmin()">إغلاق</button>
        </div>

        <p style="font-size:13px; color:#94a3b8; margin-bottom:8px;">إعدادات الحساب والواتساب:</p>
        <input type="text" id="setNote" class="form-input" placeholder="النص العلوي بجانب الشعار">
        <input type="text" id="setBankName" class="form-input" placeholder="اسمك الكامل في تطبيق بنكك">
        <input type="text" id="setBankAcc" class="form-input" placeholder="رقم حسابك في بنكك">
        <input type="text" id="setWhats" class="form-input" placeholder="رقم الواتساب الخاص بك (مثال: 249912345678)">
        <button class="btn btn-blue" style="margin-bottom:20px;" onclick="saveSettings()">حفظ الإعدادات</button>

        <hr style="border-color:#1e293b; margin-bottom:20px;">
        <h4 style="color:#00a3ff; margin-bottom:10px;">إضافة منتج جديد:</h4>
        <input type="text" id="pName" class="form-input" placeholder="اسم المنتج">
        <input type="number" id="pPrice" class="form-input" placeholder="السعر بالأرقام (مثال: 15000)">
        <textarea id="pDesc" class="form-input" rows="2" placeholder="وصف المنتج"></textarea>
        <label style="font-size:13px; color:#cbd5e1; display:block; margin-bottom:6px;">اختر صورة المنتج:</label>
        <input type="file" id="pImage" class="form-input" accept="image/*">
        <button class="btn btn-blue" id="publishBtn" onclick="addProduct()">نشر المنتج الآن</button>

        <hr style="border-color:#1e293b; margin:20px 0;">
        <h4 style="color:#fbbf24; margin-bottom:10px;">مراجعة إشعارات الدفع:</h4>
        <div id="adminOrdersList"></div>
    </div>

    <div id="productsGrid" class="products-grid"></div>
</div>

<div id="cartModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:10px;">سلة المشتريات والدفع</h3>
        <div id="cartItems" style="margin-bottom:10px; font-size:14px;"></div>
        <div style="font-weight:bold; font-size:16px; color:#0066ff; margin-bottom:12px;">
            المبلغ المطلوب من السلة: <span id="cartTotal">0</span> ج.س
        </div>

        <div id="checkoutStep1">
            <div class="bank-info">
                <strong>يرجى الدفع عبر تطبيق بنكك:</strong><br>
                الاسم: <span id="dispBankName" style="font-weight:bold;"></span><br>
                رقم الحساب: <span id="dispBankAcc" style="font-weight:bold; color:#0066ff; font-size:16px;"></span>
            </div>
            <input type="text" id="custName" placeholder="اكتب اسمك الكامل" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ccc; border-radius:8px;">
            <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:5px;">ضع صورة الإشعار هنا:</label>
            <input type="file" id="receiptImg" accept="image/*" style="width:100%; margin-bottom:12px;">
            <button class="btn btn-blue" id="sendReceiptBtn" onclick="submitReceipt()">إرسال الإشعار</button>
        </div>

        <div id="checkoutStatus" style="display:none;"></div>

        <button class="btn btn-red" style="width:100%; margin-top:10px;" onclick="closeCart()">إغلاق</button>
    </div>
</div>

<script>
    const OWNER_PASS = "69866986";
    let isAdmin = false;
    let tapCount = 0;
    let tapTimer = null;

    let settings = JSON.parse(localStorage.getItem('nsk_settings')) || {
        note: "أهلاً بكم في NSK",
        bankName: "صاحب متجر NSK",
        bankAcc: "0000000",
        whats: "249900000000"
    };

    let products = JSON.parse(localStorage.getItem('nsk_products')) || [
        {
            id: 1,
            name: "منتج تجريبي NSK",
            price: 15000,
            desc: "اضغط 5 مرات على شعار NSK في الأعلى للدخول كمالك وإضافة منتجاتك.",
            image: "https://placeholder.com"
        }
    ];
    let cart = [];

    function init() {
        document.getElementById('headerNote').innerText = settings.note;
        document.getElementById('setNote').value = settings.note;
        document.getElementById('setBankName').value = settings.bankName;
        document.getElementById('setBankAcc').value = settings.bankAcc;
        document.getElementById('setWhats').value = settings.whats;
        renderProducts();
        renderAdminOrders();
    }

    function handleSecretTap() {
        if (isAdmin) return;
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 2500);
        if (tapCount >= 5) {
            tapCount = 0;
            const pass = prompt("أدخل باسوورد المالك:");
            if (pass === OWNER_PASS) {
                isAdmin = true;
                document.getElementById('adminPanel').style.display = 'block';
                renderProducts();
                renderAdminOrders();
            } else if (pass !== null) {
                alert("الباسوورد غير صحيح!");
            }
        }
    }

    function closeAdmin() {
        isAdmin = false;
        document.getElementById('adminPanel').style.display = 'none';
        renderProducts();
    }

    function saveSettings() {
        settings.note = document.getElementById('setNote').value;
        settings.bankName = document.getElementById('setBankName').value;
        settings.bankAcc = document.getElementById('setBankAcc').value;
        settings.whats = document.getElementById('setWhats').value;
        localStorage.setItem('nsk_settings', JSON.stringify(settings));
        document.getElementById('headerNote').innerText = settings.note;
        alert("تم حفظ الإعدادات بنجاح!");
    }

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const maxW = 450;
                const scale = maxW / img.width;
                canvas.width = maxW;
                canvas.height = img.height * scale;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                callback(canvas.toDataURL('image/jpeg', 0.7));
            };
